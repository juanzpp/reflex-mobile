<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090b16"><title>REFLEX Mobile</title><style>*{box-sizing:border-box}body{margin:0;background:#090b16;color:#f5f6ff;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}main{max-width:850px;margin:auto;padding:22px}h1{font-size:32px;letter-spacing:4px;margin:5px 0}p{color:#a4abc6}button{cursor:pointer;touch-action:manipulation;border:1px solid #394268;border-radius:14px;padding:15px;color:white;background:#1d2545;font-weight:700}button:active{transform:scale(.97)}.primary{background:linear-gradient(110deg,#7951ff,#3d79ff);border:0}.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}.mode.selected{outline:2px solid #9975ff;background:#27204b}.panel{border:1px solid #2b3457;border-radius:22px;padding:18px;background:#11172a}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.stats{display:flex;gap:20px;margin:14px 0;font-variant-numeric:tabular-nums}.stats b{font-size:24px}.stats small{display:block;color:#a4abc6}.arena{position:relative;height:min(64vh,550px);min-height:330px;border-radius:20px;overflow:hidden;background:radial-gradient(circle at center,#19254a,#0d1325);border:1px solid #364366;touch-action:none;user-select:none}.target{position:absolute;border-radius:50%;width:62px;height:62px;background:radial-gradient(circle,#fff 0 12%,#9afaff 13% 32%,#6857ff 33% 65%,#252357 66%);box-shadow:0 0 25px #7260ff88;transform:translate(-50%,-50%);touch-action:none}.hidden{display:none!important}.center{text-align:center}.muted{font-size:13px;color:#a4abc6}select{background:#202a47;color:white;padding:10px;border-radius:10px;border:1px solid #4a547a}#notice{min-height:22px;color:#b6a8ff}@media(max-width:420px){main{padding:14px}.target{width:56px;height:56px}}</style></head><body><main><div class="bar"><h1>REFLEX<span style="color:#9572ff">.</span></h1><span class="muted">MOBILE / BETA</span></div><p>Treine reflexos, precisão e velocidade no celular.</p><section id="menu" class="panel"><h2>Escolha seu treino</h2><div class="modes" id="modes"><button class="mode selected" data-mode="grid">GRIDSHOT</button><button class="mode" data-mode="precision">PRECISION</button><button class="mode" data-mode="speed">SPEED TAP</button><button class="mode" data-mode="tracking">TRACKING</button><button class="mode" data-mode="gyro">GYRO GRIDSHOT</button></div><div class="bar"><label>Duração <select id="duration"><option value="30">30 segundos</option><option value="60">60 segundos</option><option value="90">90 segundos</option></select></label><button class="primary" id="start">INICIAR TREINO →</button></div><p id="best" class="muted"></p></section><section id="game" class="hidden"><div class="bar"><button id="back">← SAIR</button><strong id="modeName">GRIDSHOT</strong></div><div class="stats"><div><small>TEMPO</small><b id="time">30</b></div><div><small>PONTOS</small><b id="score">0</b></div><div><small>PRECISÃO</small><b id="accuracy">100%</b></div></div><div id="arena" class="arena"></div><p id="notice" class="muted"></p></section><section id="result" class="panel hidden center"><h2>Treino concluído</h2><h1 id="finalScore">0</h1><p id="finalStats"></p><button class="primary" id="again">JOGAR NOVAMENTE</button> <button id="home">MENU</button></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);let mode='grid',duration=30,remaining=30,score=0,hits=0,misses=0,active=false,timer=null,target=null,moveTimer=null;const names={grid:'GRIDSHOT',precision:'PRECISION',speed:'SPEED TAP',tracking:'TRACKING',gyro:'GYRO GRIDSHOT'};function show(id){['menu','game','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function best(){const k='reflex-best-'+mode; $('best').textContent='Seu recorde neste modo: '+(localStorage.getItem(k)||'0')+' pontos'}function update(){ $('time').textContent=remaining;$('score').textContent=score;$('accuracy').textContent=Math.round(100*hits/Math.max(1,hits+misses))+'%'}function position(el){const a=$('arena'),r=a.getBoundingClientRect(),s=mode==='precision'?36:mode==='speed'?48:62;el.style.width=s+'px';el.style.height=s+'px';el.style.left=(s/2+Math.random()*Math.max(1,r.width-s))+'px';el.style.top=(s/2+Math.random()*Math.max(1,r.height-s))+'px'}function spawn(){if(!active)return;const a=$('arena');a.replaceChildren();target=document.createElement('div');target.className='target';position(target);a.append(target);target.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!active)return;hits++;score+=mode==='precision'?150:100;update();spawn()})}function stop(){active=false;clearInterval(timer);clearInterval(moveTimer);timer=null;moveTimer=null;$('arena').replaceChildren()}function finish(){stop();const key='reflex-best-'+mode;const old=Number(localStorage.getItem(key)||0);if(score>old)localStorage.setItem(key,String(score));$('finalScore').textContent=score+' pts';$('finalStats').textContent=names[mode]+' · '+hits+' acertos · '+misses+' erros · '+Math.round(100*hits/Math.max(1,hits+misses))+'% de precisão';show('result')}async function start(){stop();duration=Number($('duration').value);remaining=duration;score=hits=misses=0;active=true;show('game');$('modeName').textContent=names[mode];$('notice').textContent='';update();spawn();if(mode==='gyro'){if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){try{const status=await DeviceOrientationEvent.requestPermission();$('notice').textContent=status==='granted'?'Giroscópio autorizado. Toque nos alvos.':'Giroscópio não autorizado; use os dedos.'}catch(e){$('notice').textContent='Permissão de giroscópio indisponível; use os dedos.'}}else{$('notice').textContent='Use os dedos. Sensor de movimento depende do aparelho.'}window.addEventListener('deviceorientation',orientation,{passive:true})}if(mode==='tracking'){moveTimer=setInterval(()=>{if(target&&active)position(target)},550)}timer=setInterval(()=>{remaining--;update();if(remaining<=0)finish()},1000)}function orientation(e){if(!active||mode!=='gyro'||!target||e.gamma==null)return;const a=$('arena').getBoundingClientRect();const x=Math.max(35,Math.min(a.width-35,a.width/2+e.gamma*3));const y=Math.max(35,Math.min(a.height-35,a.height/2+e.beta*1.5));target.style.left=x+'px';target.style.top=y+'px'}$('modes').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('selected',x===b));best()});$('arena').addEventListener('pointerdown',e=>{if(!active||e.target!==$('arena'))return;misses++;update()});$('start').addEventListener('click',start);$('back').addEventListener('click',()=>{stop();show('menu');best()});$('again').addEventListener('click',start);$('home').addEventListener('click',()=>{show('menu');best()});best()})();</script></body></html>
